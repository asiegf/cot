openapi: 3.1.0
info:
  title: Minimal API
  version: 1.0.0
  description: A minimal example API for testing spec generation.
  contact:
    name: API Support
servers:
  - url: http://localhost:8080
tags:
  - name: status
    description: Status operations
  - name: items
    description: Item operations
paths:
  /status:
    get:
      summary: Get status
      description: Returns the current status of the API.
      operationId: getStatus
      tags:
        - status
      responses:
        '200':
          description: API is healthy
  /items:
    get:
      summary: Get items
      description: Returns a list of all items. The list may be empty.
      operationId: getItems
      tags:
        - items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /featured-items:
    get:
      summary: Get featured items
      description: Returns a bounded list of featured items.
      operationId: getFeaturedItems
      tags:
        - items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  $ref: '#/components/schemas/Item'
  /secure:
    get:
      summary: Get secure resource
      description: Returns a resource that requires bearer authentication.
      operationId: getSecure
      tags:
        - status
      security:
        - bearerAuth: []
          profileAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Missing or invalid bearer token
  /items/{id}:
    get:
      summary: Get a single item
      description: Returns a single item by its ID.
      operationId: getItemById
      tags:
        - items
      security:
        - tokenAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: mode
          in: query
          required: false
          schema:
            type: string
            example: def
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Missing token header
  /places:
    get:
      summary: List places
      operationId: getPlaces
      tags:
        - places
      responses:
        '200':
          description: All places
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Place'
  /places/{id}:
    get:
      summary: Get a place
      description: >-
        A place, documented both as plain JSON and as a GeoJSON feature. The server
        answers with GeoJSON; the response is validated against the schema of the media
        type it was sent with.
      operationId: getPlace
      tags:
        - places
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Place'
            application/geo+json:
              schema:
                $ref: '#/components/schemas/PlaceFeature'
        '404':
          description: Unknown place
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /uploads:
    post:
      summary: Upload a file
      operationId: postUpload
      tags:
        - uploads
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                comment:
                  type: string
      responses:
        '201':
          description: Stored upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          description: No file part
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /exports/items.csv:
    get:
      summary: Export items as CSV
      description: Streamed over an async channel (http-kit); needs a real server.
      operationId: exportItems
      tags:
        - items
      responses:
        '200':
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    profileAuth:
      type: apiKey
      in: header
      name: profile
    tokenAuth:
      type: apiKey
      in: header
      name: token
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
    Status:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
    Place:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    PlaceFeature:
      type: object
      required:
        - type
        - geometry
        - properties
      properties:
        type:
          const: Feature
        geometry:
          type: object
          required:
            - type
            - coordinates
          properties:
            type:
              type: string
            coordinates:
              type: array
              items:
                type: number
        properties:
          $ref: '#/components/schemas/Place'
    Upload:
      type: object
      required:
        - name
        - size
        - contentType
      properties:
        name:
          type: string
        size:
          type: integer
        contentType:
          type: string
        comment:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
