openapi: 3.1.0
info:
  title: Minimal API
  version: 1.0.0
  description: A minimal example API for testing spec generation.
  contact:
    name: API Support
servers:
  - url: http://localhost:8080
tags:
  - name: status
    description: Status operations
  - name: items
    description: Item operations
paths:
  /status:
    get:
      summary: Get status
      description: Returns the current status of the API.
      operationId: getStatus
      tags:
        - status
      responses:
        '200':
          description: API is healthy
  /items:
    get:
      summary: Get items
      description: Returns a list of all items. The list may be empty.
      operationId: getItems
      tags:
        - items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
  /featured-items:
    get:
      summary: Get featured items
      description: Returns a bounded list of featured items.
      operationId: getFeaturedItems
      tags:
        - items
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                minItems: 1
                maxItems: 2
                items:
                  $ref: '#/components/schemas/Item'
  /secure:
    get:
      summary: Get secure resource
      description: Returns a resource that requires bearer authentication.
      operationId: getSecure
      tags:
        - status
      security:
        - bearerAuth: []
          profileAuth: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        '401':
          description: Missing or invalid bearer token
  /items/{id}:
    get:
      summary: Get a single item
      description: Returns a single item by its ID.
      operationId: getItemById
      tags:
        - items
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
        '401':
          description: Missing token header
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    profileAuth:
      type: apiKey
      in: header
      name: profile
  schemas:
    Item:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
          enum:
            - active
            - inactive
    Status:
      type: object
      properties:
        ok:
          type: boolean
        message:
          type: string
